version: "3.8"

services:
  # ============================================================================
  # 1. DATABASE & CACHE INFRASTRUCTURE
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ecosystem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-financial_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-financial_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: ecosystem-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  # ============================================================================
  # 2. CORE FINANCIAL API (JAVA 21 / SPRING BOOT 3)
  # ============================================================================
  financial-api:
    build:
      context: ./enterprise-financial-api
      dockerfile: Dockerfile
    container_name: ecosystem-financial-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/financial_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      APP_SECURITY_USER: ${APP_SECURITY_USER:-admin}
      APP_SECURITY_PASSWORD: ${APP_SECURITY_PASSWORD:-admin123}
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q 'UP' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 35s
    networks:
      - app-network

  # ============================================================================
  # 3. NOTIFICATION & EVENT ENGINE (NODE.JS / FASTIFY)
  # ============================================================================
  notification-api:
    build:
      context: ./notification-event-engine
      dockerfile: Dockerfile
    container_name: ecosystem-notification-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/notification_engine?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      RATE_LIMIT_MAX: 500
      RATE_LIMIT_WINDOW_MS: 60000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health | grep -q 'healthy' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - app-network

  # ============================================================================
  # 4. DEDICATED EVENT WORKER (NODE.JS / BULLMQ)
  # ============================================================================
  notification-worker:
    build:
      context: ./notification-event-engine
      dockerfile: Dockerfile
    container_name: ecosystem-notification-worker
    restart: unless-stopped
    command: ["node", "dist/workers/notification.worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/notification_engine?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification-api:
        condition: service_started
    networks:
      - app-network

# ==============================================================================
# PERSISTENCE & NETWORKING
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  app-network:
    driver: bridge
